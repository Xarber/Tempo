server {
    listen 80;
    server_name tempo.xcenter.it;
    return 301 https://tempo.xcenter.it$request_uri;
}

server {
    include /etc/nginx/snippets/xcenter-deny-hidden.conf;
    listen 443 ssl;
    server_name tempo.xcenter.it;
    ssl_certificate /etc/letsencrypt/live/xcenter.it-0002/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xcenter.it-0002/privkey.pem;

    root /srv/xcenter/apps/tempo/current;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache" always;
    access_log off;

    location = /manifest.webmanifest {
        default_type application/manifest+json;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
