name: UADS quality
on:
  pull_request:
    branches: [testing, beta, main]
  push:
    branches: [testing]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: uads-quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: pip install jsonschema==4.25.1
      - run: python scripts/validate-uads.py
      - run: npm ci
      - run: npm run typecheck
      - run: node --experimental-test-coverage --test Tests/WebTests/*.test.mjs
      - run: python -m unittest discover -s Tests/BrowserTests -p 'test_*.py'
      - run: node --test Tests/BrowserTests/policy.test.mjs
      - run: git diff --check HEAD^ HEAD
      - run: npm audit --audit-level=high
